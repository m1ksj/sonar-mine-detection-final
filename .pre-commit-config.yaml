repos:
  - repo: local
    hooks:
      - id: run-unittests
        name: Run unittests
        entry: python -m unittest discover tests
        language: python
        pass_filenames: false

      - id: flake8
        name: flake8
        entry: python -m flake8
        language: python
        additional_dependencies:
          - flake8==7.1.1
        types: [python]
